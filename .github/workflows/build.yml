name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.CAMALERT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CAMALERT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::CAMALERT_KEYSTORE_B64 secret missing; signing with a throwaway debug key"
          fi

      - name: Test and build
        env:
          CAMALERT_KEYSTORE_PASSWORD: ${{ secrets.CAMALERT_KEYSTORE_PASSWORD }}
          CAMALERT_KEY_ALIAS: ${{ secrets.CAMALERT_KEY_ALIAS }}
          CAMALERT_KEY_PASSWORD: ${{ secrets.CAMALERT_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: camalert-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      # 앱의 자동 업데이트가 releases/latest의 camalert.apk를 받아감. 태그 끝 숫자 = versionCode
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'manual build' }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk camalert.apk
          gh release create "v0.1.${{ github.run_number }}" camalert.apk \
            --title "0.1.${{ github.run_number }}" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"
